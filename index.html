    <link rel="preconnect" href="https://fonts.googleapis.com">

    <style>
        /* ==========================================================================
           ESTILOS DEL CATÁLOGO DESPLEGABLE DE CÁMARAS DE SEGURIDAD
           ========================================================================== */
        .products-detail-section {
            padding: 80px 0;
            background-color: #f9fafb;
            border-top: 1px solid #e5e7eb;
            border-bottom: 1px solid #e5e7eb;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Estado activo gatillado por JavaScript */
        .products-detail-section.show {
            opacity: 1;
            transform: translateY(0);
        }

        .detail-header {
            margin-bottom: 50px;
        }

        .detail-header p {
            color: #4b5563;
            max-width: 600px;
            margin: 12px auto 0;
        }

        /* Cuadrícula de productos */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .product-item-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 32px;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .product-icon-wrapper {
            color: #0052cc;
            margin-bottom: 20px;
        }

        .product-item-card h4 {
            font-family: 'Sora', sans-serif;
            font-size: 1.25rem;
            margin-bottom: 12px;
            color: #111827;
        }

        .product-item-card p {
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            color: #4b5563;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        /* Etiquetas */
        .product-tag {
            position: absolute;
            top: 20px;
            right: 20px;
            font-family: 'Inter', sans-serif;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
        }
        .badge-popular { background: #e0f2fe; color: #0369a1; }
        .badge-premium { background: #fef3c7; color: #d97706; }
        .badge-advanced { background: #dcfce7; color: #15803d; }

        /* Lista de características */
        .product-features {
            list-style: none;
            padding: 0;
            margin: 0 0 28px 0;
            margin-top: auto; 
        }

        .product-features li {
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            color: #374151;
            position: relative;
            padding-left: 20px;
            margin-bottom: 8px;
        }

        .product-features li::before {
            content: "✓";
            position: absolute;
            left: 0;
            color: #16a34a;
            font-weight: bold;
        }

        .btn.compact {
            padding: 10px 20px;
            font-size: 0.9rem;
            text-align: center;
            justify-content: center;
        }
    </style>
</head>
